hub.anduinos.com {
	log
	import hsts
	import rate_limit
	encode br gzip
	@hacker {
		# Methos is not GET nor HEAD
		not method GET HEAD
		not remote_ip 172.18.0.0/16
	}

	handle @hacker {
		header Content-Type text/html
		respond "<h1>You are not the admin! Don't try to admin my registry server :)" 403
	}

	reverse_proxy http://registry_registry-ui {
	}
}
