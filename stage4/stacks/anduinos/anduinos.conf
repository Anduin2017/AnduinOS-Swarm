docs.anduinos.com {
	tls /data/caddy/certs/anduinos.pem /data/caddy/certs/anduinos.key
	log
	import hsts
	import limit_to_cloudflare

	encode br gzip
	reverse_proxy http://anduinos_docs:5000 {
		header_up X-Forwarded-For {http.request.header.Cf-Connecting-Ip}
	}
}

www.anduinos.com {
	tls /data/caddy/certs/anduinos.pem /data/caddy/certs/anduinos.key
	log
	import hsts
	import limit_to_cloudflare

	encode br gzip
	reverse_proxy http://anduinos_app:5000 {
		header_up X-Forwarded-For {http.request.header.Cf-Connecting-Ip}
	}
}

anduinos.com {
	tls /data/caddy/certs/anduinos.pem /data/caddy/certs/anduinos.key
	log
	import hsts
	import limit_to_cloudflare

	encode br gzip
	redir https://www.anduinos.com{uri}
}