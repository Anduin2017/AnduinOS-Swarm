docs.anduinos.com {
	tls /data/caddy/certs/anduinos.pem /data/caddy/certs/anduinos.key
	log
	import hsts
	import rate_limit
	encode br gzip
	reverse_proxy http://anduinos_docs:5000 {
	}
}

www.anduinos.com {
	tls /data/caddy/certs/anduinos.pem /data/caddy/certs/anduinos.key
	log
	import hsts
	import rate_limit
	encode br gzip
	reverse_proxy http://anduinos_app:5000 {
	}
}

anduinos.com {
	tls /data/caddy/certs/anduinos.pem /data/caddy/certs/anduinos.key
	log
	import hsts
	import rate_limit
	encode br gzip
	redir https://www.anduinos.com{uri}
}