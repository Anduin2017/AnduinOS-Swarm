version: '3.3'

services:
  docs:
    image: anduin2019/anduinos-docs
    networks:
      - proxy_app
    deploy:
      replicas: 2
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'

  home:
    image: anduin2019/anduinos-home
    networks:
      - proxy_app
    deploy:
      replicas: 2
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'


networks:
  proxy_app:
    external: true